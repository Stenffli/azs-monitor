<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель АЗС</title>
    <script>
        // ===== ПАРОЛЬ =====
        (function() {
            var password = prompt('Введите пароль для доступа к админ-панели:');
            if (password !== 'Azs2026!') { // ← ЗАМЕНИ НА СВОЙ ПАРОЛЬ
                document.body.innerHTML = '<h1 style="text-align:center;margin-top:50px;color:red;">⛔ Доступ запрещён</h1>';
                throw new Error('Доступ запрещён');
            }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f5f7fa; padding: 20px; max-width: 800px; margin: 0 auto; }
        .container { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a1a2e; margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 24px; font-size: 14px; }
        label { display: block; font-weight: 500; margin: 12px 0 4px; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; margin-bottom: 8px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-outline { background: transparent; border: 1px solid #d1d5db; color: #374151; }
        .btn-outline:hover { background: #f3f4f6; }
        .fuel-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .fuel-row input { flex: 1; margin-bottom: 0; }
        .fuel-row .btn-remove { background: #ef4444; color: white; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .link { margin-top: 16px; display: block; color: #0077ff; text-decoration: none; font-size: 14px; }
        .warning { background: #fef3c7; padding: 12px; border-radius: 6px; margin-bottom: 16px; color: #92400e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛽ Админ-панель</h1>
        <div class="subtitle">Добавление новой АЗС на карту</div>
        
        <div class="warning">
            ⚠️ Все данные сохраняются в Google Таблицу и базу данных. Заправка появится на сайте через 1–2 минуты.
        </div>

        <form id="addForm">
            <label>Название АЗС *</label>
            <input type="text" id="stationName" placeholder="Например: Лукойл (ул. Ленина, 10)" required>

            <label>Сеть (необязательно)</label>
            <input type="text" id="stationNetwork" placeholder="Лукойл, Роснефть, Газпромнефть...">

            <label>Адрес *</label>
            <input type="text" id="stationAddress" placeholder="ул. Ленина, 10, г. Славянск-на-Кубани" required>

            <label>Широта *</label>
            <input type="number" id="stationLat" step="0.000001" placeholder="45.248870" required>

            <label>Долгота *</label>
            <input type="number" id="stationLon" step="0.000001" placeholder="38.098440" required>

            <div style="margin-top:16px;margin-bottom:12px;">
                <h3 style="font-size:16px;margin-bottom:8px;">⛽ Цены на топливо</h3>
                <div id="fuelContainer">
                    <div class="fuel-row">
                        <input type="text" class="fuel-type" placeholder="АИ-92" value="АИ-92">
                        <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                        <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                        <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
                    </div>
                    <div class="fuel-row">
                        <input type="text" class="fuel-type" placeholder="АИ-95" value="АИ-95">
                        <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                        <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                        <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
                    </div>
                    <div class="fuel-row">
                        <input type="text" class="fuel-type" placeholder="ДТ" value="ДТ">
                        <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                        <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                        <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
                    </div>
                </div>
                <button type="button" class="btn btn-outline" onclick="addFuelRow()" style="margin-top:8px;">➕ Добавить вид топлива</button>
            </div>

            <div style="margin-top:16px;display:flex;gap:8px;">
                <button type="submit" class="btn btn-success">✅ Добавить АЗС</button>
                <button type="reset" class="btn btn-outline">🔄 Очистить</button>
            </div>
        </form>

        <div id="result" style="margin-top:16px;padding:12px;border-radius:6px;display:none;"></div>
        <a href="https://azs-monitor.onrender.com" target="_blank" class="link">← Вернуться на сайт</a>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ФУНКЦИИ ДЛЯ ТОПЛИВА
        // ============================================================
        function addFuelRow() {
            const container = document.getElementById('fuelContainer');
            const row = document.createElement('div');
            row.className = 'fuel-row';
            row.innerHTML = `
                <input type="text" class="fuel-type" placeholder="Вид топлива">
                <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
            `;
            container.appendChild(row);
        }

        function removeFuelRow(btn) {
            const container = document.getElementById('fuelContainer');
            if (container.children.length > 1) {
                btn.parentElement.remove();
            } else {
                showToast('❌ Должна быть хотя бы одна строка топлива', 'error');
            }
        }

        // ============================================================
        // ОТПРАВКА ФОРМЫ НА ОСНОВНОЙ САЙТ
        // ============================================================
        document.getElementById('addForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('stationName').value.trim();
            const network = document.getElementById('stationNetwork').value.trim();
            const address = document.getElementById('stationAddress').value.trim();
            const lat = parseFloat(document.getElementById('stationLat').value);
            const lon = parseFloat(document.getElementById('stationLon').value);

            if (!name || !address || isNaN(lat) || isNaN(lon)) {
                showToast('❌ Заполните все обязательные поля (название, адрес, координаты)', 'error');
                return;
            }

            const fuelTypes = document.querySelectorAll('.fuel-type');
            const fuelPrices = document.querySelectorAll('.fuel-price');
            const fuelAvails = document.querySelectorAll('.fuel-avail');

            const prices = [];
            for (let i = 0; i < fuelTypes.length; i++) {
                const type = fuelTypes[i].value.trim();
                const price = parseFloat(fuelPrices[i].value);
                const avail = parseInt(fuelAvails[i].value) || 1;
                if (type && !isNaN(price) && price > 0) {
                    prices.push({ fuel_type: type, price: price, availability: avail });
                }
            }

            if (prices.length === 0) {
                showToast('❌ Добавьте хотя бы один вид топлива с ценой', 'error');
                return;
            }

            const data = {
                name: name,
                network: network || 'Неизвестно',
                address: address,
                latitude: lat,
                longitude: lon,
                prices: prices
            };

            try {
                const response = await fetch('https://azs-monitor.onrender.com/api/admin/add-station', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    showToast('✅ ' + result.message, 'success');
                    this.reset();
                    // Восстанавливаем дефолтные строки топлива
                    document.getElementById('fuelContainer').innerHTML = `
                        <div class="fuel-row">
                            <input type="text" class="fuel-type" placeholder="АИ-92" value="АИ-92">
                            <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                            <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                            <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
                        </div>
                        <div class="fuel-row">
                            <input type="text" class="fuel-type" placeholder="АИ-95" value="АИ-95">
                            <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                            <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                            <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
                        </div>
                        <div class="fuel-row">
                            <input type="text" class="fuel-type" placeholder="ДТ" value="ДТ">
                            <input type="number" class="fuel-price" placeholder="Цена" step="0.01">
                            <input type="number" class="fuel-avail" placeholder="Наличие (1/0)" value="1" style="max-width:80px;">
                            <button type="button" class="btn-remove" onclick="removeFuelRow(this)">✕</button>
                        </div>
                    `;
                } else {
                    showToast('❌ ' + (result.error || 'Ошибка добавления'), 'error');
                }
            } catch (error) {
                showToast('❌ Ошибка сервера: ' + error.message, 'error');
            }
        });

        // ============================================================
        // ТОАСТ (УВЕДОМЛЕНИЯ)
        // ============================================================
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
